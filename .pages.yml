{
  "media": {
    "input": "assets/uploads",
    "output": "assets/uploads",
    "extensions": [
      "jpg",
      "jpeg",
      "png",
      "webp"
    ],
    "rename": "safe"
  },
  "components": {
    "bilingual": {
      "type": "object",
      "fields": [
        {
          "name": "sq",
          "type": "text",
          "label": "Shqip / Albanian",
          "required": true
        },
        {
          "name": "en",
          "type": "text",
          "label": "English",
          "required": true
        }
      ]
    }
  },
  "content": [
    {
      "name": "contact",
      "label": "Contact and settings",
      "type": "file",
      "path": "data/site.json",
      "format": "json",
      "fields": [
        {
          "name": "defaultLanguage",
          "type": "select",
          "label": "Default language",
          "required": true,
          "options": {
            "values": [
              {
                "name": "sq",
                "label": "Shqip"
              },
              {
                "name": "en",
                "label": "English"
              }
            ]
          }
        },
        {
          "name": "contact",
          "type": "object",
          "label": "Public contact details",
          "fields": [
            {
              "name": "name",
              "type": "string",
              "required": true
            },
            {
              "name": "linkedin",
              "type": "string",
              "required": true,
              "pattern": "^https://www\\.linkedin\\.com/in/"
            },
            {
              "name": "whatsapp",
              "type": "string",
              "label": "WhatsApp number",
              "description": "Public number: +355697415353. Use + and country code, no spaces. Leave empty to disable.",
              "pattern": "^\\+[1-9][0-9]{6,14}$"
            },
            {
              "name": "phone",
              "type": "string",
              "label": "Public call number",
              "pattern": "^\\+[1-9][0-9]{6,14}$"
            },
            {
              "name": "email",
              "type": "string",
              "label": "Public enquiries email",
              "description": "Optional. Add only a working inbox you want displayed publicly."
            },
            {
              "name": "socials",
              "type": "object",
              "label": "YouTube / social profiles",
              "list": true,
              "fields": [
                {
                  "name": "label",
                  "type": "string",
                  "required": true
                },
                {
                  "name": "url",
                  "type": "string",
                  "required": true,
                  "pattern": "^https://"
                }
              ]
            }
          ]
        }
      ]
    },
    {
      "name": "projects",
      "label": "Projects and portfolio",
      "type": "file",
      "path": "data/projects.json",
      "format": "json",
      "list": true,
      "fields": [
        {
          "name": "id",
          "type": "string",
          "label": "Unique project ID",
          "required": true,
          "pattern": "^[a-z0-9-]+$"
        },
        {
          "name": "category",
          "type": "select",
          "required": true,
          "options": {
            "values": [
              {
                "name": "electrical",
                "label": "Electrical"
              },
              {
                "name": "cameras",
                "label": "Cameras"
              },
              {
                "name": "it",
                "label": "IT and networks"
              }
            ]
          }
        },
        {
          "name": "kind",
          "type": "select",
          "required": true,
          "options": {
            "values": [
              {
                "name": "example",
                "label": "Illustrative example"
              },
              {
                "name": "project",
                "label": "Real completed project"
              }
            ]
          }
        },
        {
          "name": "image",
          "type": "image",
          "required": true,
          "description": "JPG, PNG or WebP, maximum 5 MB. Choose a photo approved for public use."
        },
        {
          "name": "title",
          "label": "Project title",
          "component": "bilingual"
        },
        {
          "name": "summary",
          "label": "Short description",
          "component": "bilingual"
        },
        {
          "name": "detail",
          "label": "Full description",
          "component": "bilingual"
        },
        {
          "name": "items",
          "type": "object",
          "fields": [
            {
              "name": "sq",
              "type": "string",
              "label": "Shqip",
              "list": {
                "min": 1
              },
              "required": true
            },
            {
              "name": "en",
              "type": "string",
              "label": "English",
              "list": {
                "min": 1
              },
              "required": true
            }
          ]
        },
        {
          "name": "links",
          "type": "object",
          "label": "YouTube / social video links",
          "list": true,
          "fields": [
            {
              "name": "label",
              "label": "Link label",
              "component": "bilingual"
            },
            {
              "name": "url",
              "type": "string",
              "required": true,
              "pattern": "^https://"
            }
          ]
        },
        {
          "name": "approved",
          "type": "boolean",
          "label": "Permission to publish confirmed",
          "description": "Required for real projects. Check only after approval of the text and media."
        },
        {
          "name": "source",
          "type": "string",
          "label": "Public approval note",
          "description": "Required for real projects; e.g. Owner approved for publication. This is PUBLIC — no private emails, client details or credentials."
        }
      ]
    },
    {
      "name": "reviews",
      "label": "Client references",
      "type": "file",
      "path": "data/reviews.json",
      "format": "json",
      "list": true,
      "fields": [
        {
          "name": "name",
          "type": "string",
          "label": "Approved public display name",
          "required": true
        },
        {
          "name": "quote",
          "label": "Client quote",
          "component": "bilingual"
        },
        {
          "name": "context",
          "label": "Service / context",
          "component": "bilingual"
        },
        {
          "name": "approved",
          "type": "boolean",
          "label": "Client permission confirmed",
          "required": true
        },
        {
          "name": "source",
          "type": "string",
          "label": "Public approval note",
          "required": true,
          "description": "PUBLIC text; do not enter private client details."
        }
      ]
    },
    {
      "name": "services",
      "label": "Services",
      "type": "file",
      "path": "data/services.json",
